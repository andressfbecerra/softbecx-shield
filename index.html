
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoftBecX Shield - Seguridad digital</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="encabezado">
        <div class="banner">
            <img src="img/banner-softbecx.png" alt="SoftBecX Shield. Inteligencia que protege tu mundo digital">
        </div>

        <nav class="navegacion">
            <a class="enlace-activo" href="#Inicio">Inicio</a>
            <a href="reporte-incidente.html">Reportar incidente</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main id="Inicio">
        <section class="filtros-alertas" aria-label="Filtros de alertas">
            <h2>Filtrar alertas de seguridad</h2>

            <div class="contenedor-filtros">
                <div class="campo-filtro">
                    <label for="filtro-riesgo">Nivel de riesgo</label>
                    <select id="filtro-riesgo">
                        <option value="">Todos los niveles</option>
                        <option value="alto">Alto</option>
                        <option value="medio">Medio</option>
                        <option value="bajo">Bajo</option>
                    </select>
                </div>

                <div class="campo-filtro">
                    <label for="filtro-tipo">Tipo de alerta</label>
                    <select id="filtro-tipo">
                        <option value="">Todos los tipos</option>
                        <option value="phishing">Phishing</option>
                        <option value="url">URL</option>
                        <option value="acceso">Acceso</option>
                        <option value="malware">Malware</option>
                        <option value="transaccion">Transacción</option>
                    </select>
                </div>

                <button id="limpiar-filtros" type="button">
                    Limpiar filtros
                </button>
            </div>
        </section>

        <section id="alertas" class="catalogo" aria-label="Alertas de seguridad">
        </section>
    </main>

    <footer>
        <p>Inteligencia que protege tu mundo digital</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
