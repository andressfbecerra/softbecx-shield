<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header class="encabezado">

        <div class="banner">
            <img
                src="img/banner-softbecx.png"
                alt="SoftBecX Shield. Inteligencia que protege tu mundo digital"
            >
        </div>

        <nav class="navegacion">

    <main>

        <section id="alertas" class="catalogo">

                    src="img/actividad.png"
