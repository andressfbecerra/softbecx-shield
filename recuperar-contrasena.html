<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recupera el acceso a tu cuenta de SoftBecX Shield.">
    <title>Recuperar contraseña | SoftBecX Shield</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="pagina-recuperacion">

    <header class="encabezado-recuperacion">

        <div class="contenedor-header-recuperacion">

            <a class="logo-recuperacion" href="index.html">
                SOFTBECX <span>SHIELD</span>
            </a>

            <a class="enlace-inicio-recuperacion" href="login.html">
                Iniciar sesión
            </a>

        </div>

    </header>

    <main class="contenido-recuperacion">

        <section class="contenedor-recuperacion">

            <div class="introduccion-recuperacion">

                <h1>¿Olvidaste tu contraseña?</h1>

                <p>
                    No te preocupes. Puedes iniciar el proceso para recuperar
                    el acceso a tu cuenta.
                </p>

            </div>

            <div class="tarjeta-recuperacion">

                <div class="imagen-recuperacion">
                    <img
                        src="img/contrasena.png"
                        alt="Ilustración de recuperación de contraseña"
                    >
                </div>

                <h2>Recupera tu contraseña</h2>

                <p class="descripcion-recuperacion">
                    Ingresa el correo electrónico asociado a tu cuenta.
                </p>

                <form id="formulario-recuperacion" action="#" method="get">

                    <div class="grupo-campo-recuperacion">

                        <label for="correo">Correo electrónico</label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="ejemplo@correo.com"
                            autocomplete="email"
                            required
                        >

                        <small class="ayuda-campo-recuperacion">
                            Utiliza el correo que registraste en SoftBecX Shield.
                        </small>

                    </div>

                    <button class="boton-recuperacion" type="submit">
                        Enviar instrucciones
                    </button>

                </form>

                <p
                    id="mensaje-recuperacion"
                    class="mensaje-recuperacion"
                    role="status"
                    aria-live="polite"
                ></p>

                <a class="volver-recuperacion" href="login.html">
                    Volver al inicio de sesión
                </a>

            </div>

        </section>

    </main>
    
    <script>
        const formulario = document.querySelector("#formulario-recuperacion");
        const campoCorreo = document.querySelector("#correo");
        const mensaje = document.querySelector("#mensaje-recuperacion");

        formulario.addEventListener("submit", function (evento) {
            evento.preventDefault();

            if (!campoCorreo.checkValidity()) {
                campoCorreo.reportValidity();
                return;
            }

            mensaje.textContent =
                "La recuperación real todavía no está habilitada. No se ha enviado ningún correo.";

            mensaje.style.display = "block";
        });
    </script>

</body>

</html>
